# Bug evidence collector: when an issue is labeled `bug-report` (filed by the in-app bug report
# feature), best-effort capture a screenshot of the reported route on production and attach it to
# the issue as a comment. Screenshots are stored on the orphan `bug-assets` branch.
name: Bug Evidence

on:
  issues:
    # GitHub does not reliably emit a separate `labeled` event for labels included in the
    # create-issue API call, so also react to `opened` and check the label set in the job `if`.
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

# Per-issue queue: serializes the opened/labeled double fire for one issue while letting
# different issues run in parallel; the bug-assets push tolerates cross-issue races via the
# marker-comment idempotency check below plus git's non-fast-forward failure being best-effort.
concurrency:
  group: bug-evidence-${{ github.event.issue.number }}

jobs:
  capture:
    # An API-created issue may fire `opened` (labels already attached) and/or a separate
    # `labeled` event; match each event only against its own trigger so one issue can't
    # qualify twice through the same event.
    if: >-
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'bug-report')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'bug-report')
    runs-on: ubuntu-latest
    steps:
      - name: Skip if evidence was already attached
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Idempotency across the opened+labeled double fire: the evidence comment carries a
          # marker; if it is already present, do nothing.
          if gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json comments --jq '.comments[].body' | grep -qF '<!-- bug-evidence -->'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract route from issue body
        if: steps.dedupe.outputs.skip != 'true'
        id: route
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # The in-app report puts "- Route: /path" in the auto-collected section, which the
          # backend renders FIRST in the body (user text is fenced and comes later), so the
          # first match is the trusted one. Restrict to a conservative path charset; fall
          # back to "/".
          route="$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^- Route: \(\/[A-Za-z0-9./_~%?=&-]*\)$/\1/p' | head -1)"
          [ -n "$route" ] || route="/"
          echo "route=$route" >> "$GITHUB_OUTPUT"

      - name: Take screenshot (best effort)
        if: steps.dedupe.outputs.skip != 'true'
        id: shot
        continue-on-error: true
        env:
          ROUTE: ${{ steps.route.outputs.route }}
        run: |
          npm install --no-save playwright@1.50.1
          npx playwright install --with-deps chromium
          npx playwright screenshot --browser=chromium --viewport-size=1280,800 \
            --wait-for-timeout=8000 "https://os.cherie-lab.com${ROUTE}" screenshot.png
          echo "captured=true" >> "$GITHUB_OUTPUT"

      - name: Checkout bug-assets branch
        if: steps.shot.outputs.captured == 'true'
        uses: actions/checkout@v6
        with:
          path: repo
          fetch-depth: 1

      - name: Push screenshot to bug-assets branch
        if: steps.shot.outputs.captured == 'true'
        id: push
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          name="issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}.png"
          # actions/checkout configures a narrow refspec, so name the destination ref
          # explicitly — a bare `git fetch origin bug-assets` would only set FETCH_HEAD.
          if git fetch origin bug-assets:refs/remotes/origin/bug-assets 2>/dev/null; then
            git checkout -B bug-assets origin/bug-assets
          else
            git checkout --orphan bug-assets
            git rm -rfq . || true
          fi
          mkdir -p screenshots
          cp ../screenshot.png "screenshots/${name}"
          git add "screenshots/${name}"
          git commit -m "bug-evidence: screenshot for issue #${ISSUE_NUMBER}"
          # Retry with fetch+rebase: another issue's run may have pushed between our fetch and
          # push (the concurrency group is per-issue, so cross-issue races are possible).
          pushed=false
          for _attempt in 1 2 3; do
            if git push origin bug-assets; then
              pushed=true
              break
            fi
            git fetch origin bug-assets:refs/remotes/origin/bug-assets || true
            git rebase origin/bug-assets || { git rebase --abort || true; break; }
          done
          echo "pushed=${pushed}" >> "$GITHUB_OUTPUT"
          echo "asset_path=screenshots/${name}" >> "$GITHUB_OUTPUT"

      - name: Comment on issue
        # Only link the image when the asset push actually succeeded — a broken image link is
        # worse than the explicit failure comment below.
        if: steps.shot.outputs.captured == 'true' && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ROUTE: ${{ steps.route.outputs.route }}
          ASSET_PATH: ${{ steps.push.outputs.asset_path }}
        run: |
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/bug-assets/${ASSET_PATH}"
          # shellcheck disable=SC2016  # the backticked route is markdown, not shell expansion
          body="$(printf '<!-- bug-evidence -->\n自動収集した証跡です。本番環境の `%s` のスクリーンショットを添付します（ログインが必要な画面の場合はログイン画面が写ります）。\n\n![screenshot](%s)' "$ROUTE" "$url")"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Comment failure on issue
        # Leave a marker comment even when evidence collection failed, so the run is visibly
        # accounted for and the dedupe check prevents pointless re-runs.
        if: >-
          steps.dedupe.outputs.skip != 'true' &&
          (steps.shot.outputs.captured != 'true' || steps.push.outputs.pushed != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ROUTE: ${{ steps.route.outputs.route }}
        run: |
          # shellcheck disable=SC2016  # the backticked route is markdown, not shell expansion
          body="$(printf '<!-- bug-evidence -->\n証跡の自動収集に失敗しました（対象 route: `%s`）。スクリーンショットの撮影または保存ができなかったため、本 issue には画像を添付できません。詳細は Actions のログをご確認ください。' "$ROUTE")"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
