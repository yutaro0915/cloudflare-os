name: preview-teardown

# Removes a PR's preview fleet when the PR closes (norms: .github/agents/rubrics/flow.md
# — a closed PR must leave no workers behind). A daily sweep also deletes any -pr-N
# fleet whose PR is no longer open (covers cancelled runs, manual deploys, renames).
# KV namespaces and R2 buckets auto-provisioned by wrangler are NOT deleted with the
# worker, so delete_fleet removes them explicitly (issue #25). Leftovers still show up
# in the sweep log for manual cleanup.

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "23 19 * * *"  # daily, 04:23 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-teardown
  cancel-in-progress: false

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete preview fleets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set; nothing to tear down."
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"

          delete_fleet() {
            n="$1"
            for w in workshop context custom memory error-reporter; do
              name="cloudflare-os-$w-pr-$n"
              code=$(curl -s -o /tmp/del.json -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$api/workers/scripts/$name?force=true")
              echo "delete $name -> HTTP $code"
            done

            # Auto-provisioned KV namespaces (title: cloudflare-os-<worker>-pr-<n>-<binding>).
            KV_LIST=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$api/storage/kv/namespaces?per_page=100")
            if [ "$(printf '%s' "$KV_LIST" | jq -r '.success')" != "true" ]; then
              echo "::warning::KV namespace list failed (token permission?): $(printf '%s' "$KV_LIST" | jq -c '.errors' 2>/dev/null)"
            else
              kv_total=$(printf '%s' "$KV_LIST" | jq -r '.result | length')
              [ "$kv_total" = "100" ] && echo "::warning::KV list hit per_page=100; add pagination if fleets grow."
              printf '%s' "$KV_LIST" \
                | jq -r --arg re "^cloudflare-os-.*-pr-$n-" \
                    '.result[] | select(.title | test($re)) | "\(.id) \(.title)"' \
                | while read -r id title; do
                    code=$(curl -s -o /tmp/del.json -w '%{http_code}' -X DELETE \
                      -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                      "$api/storage/kv/namespaces/$id")
                    echo "delete kv $title -> HTTP $code"
                    case "$code" in 2*) ;; *) echo "::warning::kv delete $title returned HTTP $code";; esac
                  done
            fi

            # Auto-provisioned R2 buckets (name: cloudflare-os-<worker>-pr-<n>-<binding>).
            # Buckets must be emptied before deletion.
            R2_LIST=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$api/r2/buckets?per_page=100")
            if [ "$(printf '%s' "$R2_LIST" | jq -r '.success')" != "true" ]; then
              echo "::warning::R2 bucket list failed (token permission?): $(printf '%s' "$R2_LIST" | jq -c '.errors' 2>/dev/null)"
            else
              printf '%s' "$R2_LIST" \
                | jq -r --arg re "^cloudflare-os-.*-pr-$n-" \
                    '.result.buckets[]? | select(.name | test($re)) | .name' \
                | while read -r bucket; do
                    for _ in $(seq 1 10); do
                      OBJ=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                        "$api/r2/buckets/$bucket/objects?per_page=1000")
                      if [ "$(printf '%s' "$OBJ" | jq -r '.success')" != "true" ]; then
                        echo "::warning::r2 object list for $bucket failed: $(printf '%s' "$OBJ" | jq -c '.errors' 2>/dev/null)"
                        break
                      fi
                      KEYS=$(printf '%s' "$OBJ" | jq -r '.result[]?.key')
                      [ -z "$KEYS" ] && break
                      printf '%s\n' "$KEYS" | while read -r key; do
                        enc=$(jq -rn --arg k "$key" '$k|@uri')
                        curl -s -o /dev/null -X DELETE \
                          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                          "$api/r2/buckets/$bucket/objects/$enc"
                      done
                    done
                    code=$(curl -s -o /tmp/del.json -w '%{http_code}' -X DELETE \
                      -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                      "$api/r2/buckets/$bucket")
                    echo "delete r2 $bucket -> HTTP $code"
                    case "$code" in 2*) ;; *) echo "::warning::r2 delete $bucket returned HTTP $code (non-empty?)";; esac
                  done
            fi
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            delete_fleet "${{ github.event.number }}"
            exit 0
          fi

          # Sweep: every -pr-N fleet whose PR is not open gets deleted. PR numbers are
          # collected from workers AND leftover KV/R2 names, so orphaned storage is
          # reclaimed even after its worker is already gone (issue #25).
          NS_WORKERS=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/workers/scripts?per_page=100" \
            | jq -r '.result[]?.id | select(test("^cloudflare-os-workshop-pr-[0-9]+$")) | sub("^.*-pr-";"")')
          NS_KV=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/storage/kv/namespaces?per_page=100" \
            | jq -r '.result[]?.title | select(test("^cloudflare-os-.*-pr-[0-9]+-")) | sub("^cloudflare-os-.*-pr-";"") | sub("-.*$";"")')
          NS_R2=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/r2/buckets?per_page=100" \
            | jq -r '.result.buckets[]?.name | select(test("^cloudflare-os-.*-pr-[0-9]+-")) | sub("^cloudflare-os-.*-pr-";"") | sub("-.*$";"")')
          for n in $(printf '%s\n%s\n%s\n' "$NS_WORKERS" "$NS_KV" "$NS_R2" | grep -E '^[0-9]+$' | sort -un); do
            STATE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n" --jq .state 2>/dev/null || echo unknown)
            if [ "$STATE" != "open" ]; then
              echo "PR #$n is $STATE; removing its fleet."
              delete_fleet "$n"
            fi
          done
