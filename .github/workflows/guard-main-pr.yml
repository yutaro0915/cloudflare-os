name: guard-main-pr

# Required status check on main: PRs into main are accepted from develop only.
# Together with branch protection (no direct pushes) this makes develop -> PR -> human
# merge the single road into main. Merging itself is a human action by convention;
# the production deploy approval gate is the second line of defense.

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  pr-from-develop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject PRs not coming from develop
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::PRs into main must come from develop (got: ${{ github.head_ref }})"
            exit 1
          fi
          echo "OK: PR comes from develop"
