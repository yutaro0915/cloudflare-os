name: claude

# The fix agent of the self-improvement loop (starter docs/self-improvement-loop-plan.md).
# Triggers: @claude mentions by users with write access, or the `agent-fix` label set by
# triage. Claude reads the issue, implements on a branch, and opens a PR into develop
# (repo default branch). Merging stays human: CI + the pr-from-develop guard + the merge
# train gate everything after this point.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    # Mentions always considered; label events only act on `agent-fix`.
    if: github.event_name != 'issues' || github.event.action != 'labeled' || github.event.label.name == 'agent-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: agent-fix
          branch_prefix: agent-fix/
          base_branch: develop
