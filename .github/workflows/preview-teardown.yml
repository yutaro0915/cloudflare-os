name: preview-teardown

# Removes a PR's preview fleet when the PR closes (norms: .github/agents/rubrics/flow.md
# — a closed PR must leave no workers behind). A daily sweep also deletes any -pr-N
# fleet whose PR is no longer open (covers cancelled runs, manual deploys, renames).
# KV namespaces and R2 buckets auto-provisioned by wrangler are NOT deleted with the
# worker, so delete_fleet removes them explicitly (issue #25). Leftovers still show up
# in the sweep log for manual cleanup.

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "23 19 * * *"  # daily, 04:23 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-teardown
  cancel-in-progress: false

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete preview fleets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set; nothing to tear down."
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"

          # List helper: prints .result JSON on success, warns and prints nothing on failure.
          cf_list() {
            resp=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$1")
            if [ "$(printf '%s' "$resp" | jq -r '.success')" != "true" ]; then
              echo "::warning::list $1 failed (token permission?): $(printf '%s' "$resp" | jq -c '.errors' 2>/dev/null)" >&2
              return 1
            fi
            printf '%s' "$resp"
          }

          delete_fleet() {
            n="$1"
            for w in workshop context custom memory error-reporter; do
              name="cloudflare-os-$w-pr-$n"
              code=$(curl -s -o /tmp/del.json -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$api/workers/scripts/$name?force=true")
              echo "delete $name -> HTTP $code"
            done

            # Auto-provisioned KV namespaces (title: cloudflare-os-<worker>-pr-<n>-<binding>).
            if KV_LIST=$(cf_list "storage/kv/namespaces?per_page=100"); then
              kv_total=$(printf '%s' "$KV_LIST" | jq -r '.result | length')
              [ "$kv_total" = "100" ] && echo "::warning::KV list hit per_page=100; add pagination if fleets grow."
              printf '%s' "$KV_LIST" \
                | jq -r --arg re "^cloudflare-os-.*-pr-$n-" \
                    '.result[] | select(.title | test($re)) | "\(.id) \(.title)"' \
                | while read -r id title; do
                    code=$(curl -s -o /tmp/del.json -w '%{http_code}' -X DELETE \
                      -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                      "$api/storage/kv/namespaces/$id")
                    echo "delete kv $title -> HTTP $code"
                    case "$code" in 2*) ;; *) echo "::warning::kv delete $title returned HTTP $code";; esac
                  done
            fi

            # Auto-provisioned R2 buckets (name: cloudflare-os-<worker>-pr-<n>-<binding>).
            # Buckets must be emptied before deletion.
            if R2_LIST=$(cf_list "r2/buckets?per_page=100"); then
              printf '%s' "$R2_LIST" \
                | jq -r --arg re "^cloudflare-os-.*-pr-$n-" \
                    '.result.buckets[]? | select(.name | test($re)) | .name' \
                | while read -r bucket; do
                    prev_count=-1
                    for _ in $(seq 1 10); do
                      OBJ=$(cf_list "r2/buckets/$bucket/objects?per_page=1000") || break
                      KEYS=$(printf '%s' "$OBJ" | jq -r '.result[]?.key')
                      [ -z "$KEYS" ] && break
                      count=$(printf '%s\n' "$KEYS" | wc -l)
                      if [ "$count" = "$prev_count" ]; then
                        echo "::warning::r2 purge of $bucket made no progress ($count objects remain); aborting purge."
                        break
                      fi
                      prev_count=$count
                      purge_fail=0
                      while read -r key; do
                        enc=$(jq -rn --arg k "$key" '$k|@uri')
                        oc=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
                          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                          "$api/r2/buckets/$bucket/objects/$enc")
                        case "$oc" in 2*) ;; *)
                          echo "::warning::r2 object delete $bucket/$key returned HTTP $oc; aborting purge."
                          purge_fail=1; break;; esac
                      done <<EOF_KEYS
          $KEYS
          EOF_KEYS
                      [ "$purge_fail" = "1" ] && break
                    done
                    code=$(curl -s -o /tmp/del.json -w '%{http_code}' -X DELETE \
                      -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                      "$api/r2/buckets/$bucket")
                    echo "delete r2 $bucket -> HTTP $code"
                    case "$code" in 2*) ;; *) echo "::warning::r2 delete $bucket returned HTTP $code (non-empty?)";; esac
                  done
            fi
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            delete_fleet "${{ github.event.number }}"
            exit 0
          fi

          # Sweep: every -pr-N fleet whose PR is not open gets deleted. PR numbers are
          # collected from workers AND leftover KV/R2 names, so orphaned storage is
          # reclaimed even after its worker is already gone (issue #25).
          NS_WORKERS=$(cf_list "workers/scripts?per_page=100" \
            | jq -r '.result[]?.id | select(test("^cloudflare-os-workshop-pr-[0-9]+$")) | sub("^.*-pr-";"")' || true)
          NS_KV=$(cf_list "storage/kv/namespaces?per_page=100" \
            | jq -r '.result[]?.title | select(test("^cloudflare-os-.*-pr-[0-9]+-")) | sub("^cloudflare-os-.*-pr-";"") | sub("-.*$";"")' || true)
          NS_R2=$(cf_list "r2/buckets?per_page=100" \
            | jq -r '.result.buckets[]?.name | select(test("^cloudflare-os-.*-pr-[0-9]+-")) | sub("^cloudflare-os-.*-pr-";"") | sub("-.*$";"")' || true)
          for n in $(printf '%s\n%s\n%s\n' "$NS_WORKERS" "$NS_KV" "$NS_R2" | grep -E '^[0-9]+$' | sort -un); do
            # Delete only on a confirmed non-open PR: state==closed, or a definite 404
            # (PR never existed). Transient API failures skip to the next sweep.
            if RESP=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n" 2>&1); then
              STATE=$(printf '%s' "$RESP" | jq -r .state)
            elif printf '%s' "$RESP" | grep -q "HTTP 404"; then
              STATE=closed
            else
              echo "::warning::could not determine state of PR #$n; skipping this sweep. ($(printf '%s' "$RESP" | head -1))"
              continue
            fi
            if [ "$STATE" != "open" ]; then
              echo "PR #$n is $STATE; removing its fleet."
              delete_fleet "$n"
            fi
          done
