name: claude-review

# Automated first-pass review of every PR into main (agent PRs and human PRs alike).
# Advisory only: it comments, it does not gate the merge — CI (ci.yml) is the hard gate.
# One sticky comment per PR, updated on each push, to avoid comment floods.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Agent PRs (claude-fix) are opened by the claude bot; reviewing them is the point.
          allowed_bots: claude
          use_sticky_comment: true
          prompt: |
            Review PR #${{ github.event.pull_request.number }} (diff via
            `gh pr diff ${{ github.event.pull_request.number }}`).

            First read .github/agents/HARNESS.md and .github/agents/rubrics/review.md
            and follow them for the whole run.

            Post the review as a PR comment with
            `gh pr comment ${{ github.event.pull_request.number }} --body "..."`.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)"
