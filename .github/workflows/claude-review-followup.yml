name: claude-review-followup

# Automated follow-up on review findings: when claude-review labels a PR
# `review-findings` (one or more must-fix findings), this workflow implements the
# minimal fixes on a `review-fix/pr-<N>` branch and opens a SIDE PR whose base is
# the original PR's head branch. Merging the side PR updates the original PR;
# the original PR then goes through review/CI again as usual.
#
# Recursion guards (two independent layers):
#  1. The side PR's base is the feature branch, not main, so claude-review.yml
#     (`branches: [main]` filter) never runs on it — no review, no new label.
#  2. The job `if` skips PRs whose head already starts with `review-fix/`, so even
#     a manually mislabeled side PR cannot spawn a follow-up of a follow-up.
# Label security: adding a label requires triage+ permission on the repo, so the
# `labeled` event can only be fired by the claude bot (via claude-review's
# GITHUB_TOKEN) or a human with write access — no extra sender check is needed.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  followup:
    if: >-
      github.event.label.name == 'review-findings' &&
      !startsWith(github.event.pull_request.head.ref, 'review-fix/') &&
      !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      # CI-only skills, same as claude-fix.yml (.claude/ is gitignored).
      - name: Materialize CI agent skills
        run: mkdir -p .claude/skills && cp -R .github/agents/skills/. .claude/skills/

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude
          branch_prefix: review-fix/
          base_branch: ${{ github.event.pull_request.head.ref }}
          prompt: |
            PR #${{ github.event.pull_request.number }} (head branch
            `${{ github.event.pull_request.head.ref }}`) received must-fix review
            findings. Implement them and open a SIDE PR into that head branch.

            First read .github/agents/HARNESS.md and .github/agents/rubrics/fix.md
            and follow them for the whole run. Exception to HARNESS.md's PR rule:
            this run's PR targets `${{ github.event.pull_request.head.ref }}`, not
            main, by design of rubrics/flow.md (review follow-up flow).

            Steps:
            1. Read the latest review by the claude bot on the PR
               (`gh pr view ${{ github.event.pull_request.number }} --comments`)
               and the diff (`gh pr diff ${{ github.event.pull_request.number }}`).
            2. You are checked out on the PR's head branch. Create branch
               `review-fix/pr-${{ github.event.pull_request.number }}` from it and
               implement ONLY the must-fix findings, as the smallest correct
               change. Verify per .github/agents/playbooks/verify-before-pr.md.
            3. Push and open the side PR with
               `gh pr create --base ${{ github.event.pull_request.head.ref }}`.
               Write the PR body in Japanese (です・ます調): list each finding and
               how it was addressed, plus a Verification section. Note in the body
               that the side PR's base is not main, so claude-review does not run
               on it (recursion guard); a human or the original author merges it
               into the feature branch.
            4. Comment on PR #${{ github.event.pull_request.number }} in Japanese:
               「サイド PR を作成しました: <URL>」 with a one-line summary.
            5. If you cannot address the findings (unclear, out of scope, or two
               failed attempts): do NOT exit silently. Run
               `gh pr edit ${{ github.event.pull_request.number }} --add-label needs-human`
               and comment your findings on the PR in Japanese.
          claude_args: |
            --model claude-opus-5
            --effort medium
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh issue view:*),Bash(pnpm:*),Bash(node:*),Bash(npx:*)"
